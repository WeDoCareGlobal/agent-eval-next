name: Zenodo

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install zenodo-client
        run: pip install zenodo-client
      - name: Publish to Zenodo
        run: |
          echo "Zenodo publication triggered on release"
